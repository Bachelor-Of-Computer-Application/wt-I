<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
</head>
<body>

<h2>Nested Table</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Details</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Ram</td>
        <td>
            <table border="1" cellpadding="5">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>Java</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>HTML</td>
                    <td>90</td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>2</td>
        <td>Shyam</td>
        <td>
            <table border="1" cellpadding="5">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>Java</td>
                    <td>80</td>
                </tr>
                <tr>
                    <td>HTML</td>
                    <td>88</td>
                </tr>
            </table>
        </td>
    </tr>

</table>

</body>
</html>
